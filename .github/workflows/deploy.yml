name: Deploy SEMANTIAR Juegos to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies 📦
        run: npm install

      - name: Verify public data 🔒
        run: python scripts/verify_public_payloads.py

      - name: Build 🚀
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"

      - name: Disable Jekyll processing 🔗
        run: touch out/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true

